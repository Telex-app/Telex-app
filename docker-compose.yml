services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: telex
      POSTGRES_PASSWORD: telex
      POSTGRES_DB: telex
    ports:
      - '5432:5432'
    volumes:
      - telex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U telex -d telex']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  telex_postgres_data:
